name: Production Deployment Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Production候補の40桁commit SHA
        required: true
        type: string
      staging_run_id:
        description: 同じ候補SHAを検証したstaging workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  verify-production-candidate:
    name: Verify production candidate from trusted main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted verifier
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify candidate is reachable from main
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node scripts/deployment-candidate-evidence.mjs verify-candidate-ref

  validate-production-candidate:
    name: Validate production candidate after approval
    needs: verify-production-candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: production-candidate-${{ inputs.candidate_sha }}
    environment: production
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify checked out candidate SHA
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run production candidate checks
        run: npm run check

      - name: Download matching staging evidence
        uses: actions/download-artifact@v4
        with:
          name: staging-evidence-${{ inputs.candidate_sha }}
          path: staging-evidence
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ github.token }}

      - name: Verify staging workflow and candidate evidence
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/deployment-candidate-evidence.mjs verify-staging-evidence

      # GitHub Environment required reviewers設定と別途ユーザー承認を確認するまでdeploy stepは追加しない。
