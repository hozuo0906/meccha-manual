name: Issue Intake Report

on:
  workflow_dispatch:
    inputs:
      max_issues:
        description: Maximum number of issues to include
        required: true
        default: "30"

permissions:
  contents: read
  issues: read

jobs:
  report:
    name: Build issue intake report
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate issue intake harness
        run: npm run issue-intake:check

      - name: Build issue intake report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_INTAKE_MAX: ${{ inputs.max_issues }}
          ISSUE_INTAKE_REPORT_PATH: issue-intake-report.md
        run: node scripts/issue-intake-report.mjs

      - name: Upload issue intake report
        uses: actions/upload-artifact@v4
        with:
          name: issue-intake-report
          path: issue-intake-report.md

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MECCHA_DISCORD_WEBHOOK_URL: ${{ secrets.MECCHA_DISCORD_WEBHOOK_URL }}
          DISCORD_DEVELOPMENT_WEBHOOK_URL: ${{ secrets.DISCORD_DEVELOPMENT_WEBHOOK_URL }}
          DISCORD_NOTIFY_ENV: development
          DISCORD_NOTIFY_REQUIRED: "false"
          DISCORD_NOTIFY_STATUS: ${{ job.status }}
          DISCORD_NOTIFY_TITLE: Issue受付レポート
          DISCORD_NOTIFY_DESCRIPTION: Discord由来Issueと未整理Issueを日本語で棚卸ししました。
          DISCORD_NOTIFY_IMPRESSION: ${{ job.status == 'success' && 'Issue受付レポートを作成しました。needs-triage、status/triage、approval-requiredを優先して確認し、作業PRに進めるものを親セッションで判断します。' || 'Issue受付レポートの作成に失敗しました。GitHub Token権限、Issueラベル定義、Actionsログを確認します。' }}
        run: npm run notify:discord
