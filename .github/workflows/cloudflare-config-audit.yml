name: Cloudflare Config Audit

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: Cloudflare Worker name
        required: true
        default: meccha-manual
      health_url:
        description: Worker health config URL
        required: true
        default: https://meccha-manual.tattoo-studio-crm.workers.dev/health/config

permissions:
  contents: read

jobs:
  audit:
    name: Audit Cloudflare runtime config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit Cloudflare settings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MECCHA_WORKER_NAME: ${{ inputs.worker_name }}
          MECCHA_WORKER_HEALTH_URL: ${{ inputs.health_url }}
        run: node scripts/cloudflare-config-audit.mjs

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-config-audit
          path: cloudflare-config-audit.md
          if-no-files-found: ignore

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MECCHA_DISCORD_WEBHOOK_URL: ${{ secrets.MECCHA_DISCORD_WEBHOOK_URL }}
          DISCORD_DEVELOPMENT_WEBHOOK_URL: ${{ secrets.DISCORD_DEVELOPMENT_WEBHOOK_URL }}
          DISCORD_NOTIFY_ENV: development
          DISCORD_NOTIFY_REQUIRED: "false"
          DISCORD_NOTIFY_STATUS: ${{ job.status }}
          DISCORD_NOTIFY_TITLE: Cloudflare設定監査
          DISCORD_NOTIFY_DESCRIPTION: Cloudflare Workerのsecret名、KV namespace、Discord bridge設定有無を確認しました。secret値は通知しません。
          DISCORD_NOTIFY_IMPRESSION: ${{ job.status == 'success' && 'Cloudflare設定監査は通っています。Actions SummaryのKV namespace IDをwrangler.jsoncへ固定すれば、deployで設定が落ちる事故を減らせます。' || 'Cloudflare設定監査で不足が出ています。Actions Summaryを見て、Worker secrets、KV binding、Discord allowlistのどれが欠けているか確認します。' }}
        run: npm run notify:discord
