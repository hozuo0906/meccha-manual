name: Cloudflare Config Audit

on:
  workflow_dispatch:
    inputs:
      worker_name:
        description: Cloudflare Worker name (narrowly validated by the script)
        required: true
        default: meccha-manual

permissions:
  contents: read

jobs:
  audit:
    name: Audit Cloudflare runtime config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit Cloudflare settings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          MECCHA_WORKER_NAME: ${{ inputs.worker_name }}
        run: node scripts/cloudflare-config-audit.mjs

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-config-audit
          path: cloudflare-config-audit.md
          if-no-files-found: ignore
