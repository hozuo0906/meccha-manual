name: Extension Privacy Browser Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extension-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/extension-mask-browser.test.mjs
      - run: node --test tests/extension-editor-browser.test.mjs
