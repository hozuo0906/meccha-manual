name: Extension Privacy Browser Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  extension-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install official Chrome for Testing
        run: node scripts/install-test-chrome.mjs
      - id: native-recording
        run: timeout --signal=TERM --kill-after=10s 6m xvfb-run -a node --test --test-reporter=tap tests/extension-native-recording-browser.test.mjs
      - id: editor
        run: timeout --signal=TERM --kill-after=10s 4m xvfb-run -a node --test --test-reporter=tap tests/extension-editor-browser.test.mjs
      - id: office
        continue-on-error: true
        run: timeout --signal=TERM --kill-after=10s 6m xvfb-run -a node --experimental-transform-types --test --test-reporter=tap tests/extension-office-export-browser.test.mjs tests/cloud-office-export-browser.test.mjs tests/extension-cloud-save-runtime-browser.test.mjs tests/office-auth-runtime-browser.test.mjs
      - id: sidepanel
        run: timeout --signal=TERM --kill-after=10s 3m xvfb-run -a node --test --test-reporter=tap tests/extension-sidepanel-browser.test.mjs
        env:
          MECCHA_SIDEPANEL_DRAFT: .artifacts/experience-repair/captured-synthetic-draft.json
      - id: captions
        run: timeout --signal=TERM --kill-after=10s 3m xvfb-run -a node --test --test-reporter=tap tests/extension-caption-browser.test.mjs
      - id: recorded
        run: timeout --signal=TERM --kill-after=10s 3m xvfb-run -a node --experimental-strip-types scripts/verify-recorded-workflow.mjs
        env:
          MECCHA_RECORDED_WORKFLOW_DRAFT: .artifacts/experience-repair/captured-synthetic-draft.json
      - name: Test saved editor and sharing with synthetic data
        id: cloud
        run: timeout --signal=TERM --kill-after=10s 10m xvfb-run -a node --experimental-strip-types --test --test-reporter=tap --test-concurrency=1 tests/cloud-manual-ui-browser.test.mjs tests/cloud-manual-sharing-ui.test.mjs tests/cloud-manual-sharing-failure-browser.test.mjs tests/cloud-manual-uiux-browser.test.mjs tests/share-viewer-browser.test.mjs tests/cloud-manual-tools-browser.test.mjs tests/onboarding-ui-browser.test.mjs tests/onboarding-share-browser.test.mjs
      - name: Preserve synthetic UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-uiux-${{ github.sha }}
          path: |
            .artifacts/uiux-20261001/screens/
            .artifacts/uiux-20261001/browser.json
            .artifacts/unified-editor/
            .artifacts/experience-repair/*.png
            .artifacts/capture-completion/
          if-no-files-found: warn
          retention-days: 14
      - name: Require every browser and recording check
        if: always()
        env:
          RESULTS: ${{ steps.native-recording.outcome }} ${{ steps.editor.outcome }} ${{ steps.office.outcome }} ${{ steps.sidepanel.outcome }} ${{ steps.captions.outcome }} ${{ steps.recorded.outcome }} ${{ steps.cloud.outcome }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "A required browser check did not pass: $result"
              exit 1
            fi
          done
