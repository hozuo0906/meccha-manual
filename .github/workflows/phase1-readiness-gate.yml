name: Phase 1 Readiness Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1-readiness:
    name: Validate Phase 1 readiness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Phase 1 readiness
        run: npm run phase1-readiness:check

      - name: Notify Discord
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MECCHA_DISCORD_WEBHOOK_URL: ${{ secrets.MECCHA_DISCORD_WEBHOOK_URL }}
          DISCORD_DEVELOPMENT_WEBHOOK_URL: ${{ secrets.DISCORD_DEVELOPMENT_WEBHOOK_URL }}
          DISCORD_NOTIFY_ENV: development
          DISCORD_NOTIFY_STATUS: ${{ job.status }}
          DISCORD_NOTIFY_TITLE: Phase 1着手前ゲート
          DISCORD_NOTIFY_DESCRIPTION: 認証、ワークスペース、RLS、service_role未使用、ユーザー承認待ち状態を確認しました。
          DISCORD_NOTIFY_IMPRESSION: ${{ job.status == 'success' && 'Phase 1着手前ゲートは通っています。次はユーザーの明示承認を受けてから、認証・ワークスペース基盤の本番開発へ進めます。' || 'Phase 1着手前ゲートで失敗しています。必要docs、RLS negative test、Worker API、service_role未使用、承認状態を確認します。' }}
        run: npm run notify:discord
