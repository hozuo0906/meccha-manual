name: Legacy Phase 1 Baseline Integrity

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1-readiness:
    name: Validate legacy Phase 1 baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Phase 1 migrations
        run: npm run migrations:check

      - name: Validate migration safety
        run: npm run migration:safety:check

      - name: Test Phase 1 migration bundle
        run: npm run test:phase1-migration-bundle

      - name: Scan sensitive values
        env:
          SECRET_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: npm run secrets:check

      - name: Validate Worker harness
        run: npm run worker:check

      - name: Typecheck Worker
        run: npm run worker:typecheck

      - name: Bundle Worker without deploying
        run: npm run worker:bundle:check

      - name: Test Worker runtime
        run: npm run worker:runtime:test

      - name: Test Worker failure mutations
        run: npm run worker:runtime:mutation:test

      - name: Test app authentication lifecycle
        run: npm run app:auth:test

      - name: Install Chromium for Phase 1 E2E
        run: npx --no-install playwright install --with-deps chromium

      - name: Test Phase 1 browser flows
        run: npm run phase1:e2e:test

      - name: Validate Worker runtime syntax
        run: |
          node --experimental-strip-types --check apps/worker/src/index.ts
          node --experimental-strip-types --check apps/worker/src/app-assets.ts

      - name: Validate legacy Phase 1 baseline
        run: npm run phase1-readiness:check

      - name: Notify Discord about legacy baseline
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MECCHA_DISCORD_WEBHOOK_URL: ${{ secrets.MECCHA_DISCORD_WEBHOOK_URL }}
          DISCORD_DEVELOPMENT_WEBHOOK_URL: ${{ secrets.DISCORD_DEVELOPMENT_WEBHOOK_URL }}
          DISCORD_NOTIFY_ENV: development
          DISCORD_NOTIFY_STATUS: ${{ job.status }}
          DISCORD_NOTIFY_TITLE: 旧Phase 1 baseline整合検査
          DISCORD_NOTIFY_DESCRIPTION: 移行前Supabase baselineのリポジトリ整合だけを確認しました。Cloudflare移行、staging受入、実装着手の承認ではありません。
          DISCORD_NOTIFY_IMPRESSION: ${{ job.status == 'success' && '旧Phase 1 baseline整合検査は成功しました。Cloudflare移行、staging受入、実装着手の承認には使用できません。Issue 176の対象マイルストーンと独立gateを確認してください。' || '旧Phase 1 baseline整合検査で失敗しています。移行前baselineの欠損だけを確認し、Cloudflare移行やstaging受入の判定には使用しません。' }}
        run: npm run notify:discord
