name: Apply PR 78 Final Three Fixes

on:
  push:
    branches:
      - feature/phase2-manual-editor-ui
    paths:
      - scripts/apply-pr78-final-three-fixes.py
      - .github/workflows/apply-pr78-final-three-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-pr78-final-three-fixes
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2-manual-editor-ui
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require expected review head
        run: test "$(git rev-parse HEAD^^^)" = "cefb0a160eb23f15f744b89cd99a07840aea0a40"
      - name: Apply fixes
        run: python scripts/apply-pr78-final-three-fixes.py
      - name: Install dependencies
        run: npm ci
      - name: Validate contracts
        run: |
          node scripts/check-phase2-manual-editor-ui.mjs
          node scripts/check-phase2-manual-edit-api.mjs
          node scripts/check-phase2-manual-step-migration.mjs
      - name: Unit and API tests
        run: |
          node --experimental-transform-types --test tests/manual-api.test.mjs tests/manual-title-docs.test.mjs tests/manual-edit-api.test.mjs
          node --test tests/manual-editor-ui.test.mjs
      - name: Install migrations in disposable Postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/phase2-manual-edit-http-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/202608140005_phase2_manual_title_length.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/202608140010_phase2_manual_step_mutations.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/202608140012_phase2_manual_edit_http_contract.sql
      - name: Exercise direct RPC and edit boundaries
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/phase2-manual-edit-http-test.sql
      - name: Existing lock regressions
        run: |
          bash scripts/test-phase2-manual-draft-locks.sh
          bash scripts/test-phase2-manual-publication-locks.sh
      - name: Migration safety
        run: |
          npm run migration:safety:check
          npm run migrations:check
      - name: Repository checks
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Phase 1 browser regression
        run: npx playwright test --config=playwright.phase1.config.mjs
      - name: Phase 2 browser regression
        run: npx playwright test --config=playwright.phase2.config.mjs
      - name: Diff check
        run: |
          git diff --check
          git diff --check origin/main...HEAD
      - name: Commit verified product fixes
        run: |
          git rm scripts/apply-pr78-final-three-fixes.py
          git add apps/worker/src/app-assets.ts \
            supabase/migrations/202608140010_phase2_manual_step_mutations.sql \
            tests/sql/phase2-manual-edit-http-test.sql \
            tests/e2e/phase2-manual-editor.spec.mjs \
            scripts/check-phase2-manual-editor-ui.mjs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close final manual editor review races"
          git push origin HEAD:feature/phase2-manual-editor-ui
