name: Docs CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Validate docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check diff whitespace
        env:
          DIFF_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          if [ -n "$DIFF_BASE_SHA" ] && git cat-file -e "$DIFF_BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$DIFF_BASE_SHA...HEAD"
          else
            git diff --check HEAD^...HEAD
          fi

      - name: Run project checks
        env:
          SECRET_SCAN_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check

      - name: Notify Discord
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MECCHA_DISCORD_WEBHOOK_URL: ${{ secrets.MECCHA_DISCORD_WEBHOOK_URL }}
          DISCORD_DEVELOPMENT_WEBHOOK_URL: ${{ secrets.DISCORD_DEVELOPMENT_WEBHOOK_URL }}
          DISCORD_NOTIFY_ENV: development
          DISCORD_NOTIFY_STATUS: ${{ job.status }}
          DISCORD_NOTIFY_TITLE: 文書・品質チェック
          DISCORD_NOTIFY_IMPRESSION: ${{ job.status == 'success' && 'チェックは通っています。PR差分とレビュー観点を見て、問題なければmerge判断に進めます。' || 'チェックで失敗しています。Actionsログを確認して、原因を直してからmerge判断します。' }}
        run: npm run notify:discord
