name: Phase 1 RLS Live Gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase1-rls-live
  cancel-in-progress: false

jobs:
  rls-live:
    name: Run live RLS negative test on staging
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - name: Checkout immutable dispatch SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable dispatch SHA
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$DISPATCH_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify staging runtime boundary
        run: npm run runtime-boundary:check

      - name: Verify Cloudflare Access credentials are present
        shell: bash
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set +x
          missing=0
          for name in CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing required staging Environment secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

      - name: Upload immutable Worker version for RLS testing
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISPATCH_SHA: ${{ github.sha }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          WRANGLER_UPLOAD_LOG_PATH: ${{ runner.temp }}/wrangler-upload.log
          IMMUTABLE_PREVIEW_ORIGIN_PATH: ${{ runner.temp }}/immutable-preview-origin
        run: |
          set +x
          trap 'rm -f "$WRANGLER_UPLOAD_LOG_PATH" "$WRANGLER_OUTPUT_FILE_PATH"' EXIT

          if ! npx --no-install wrangler versions upload \
            --keep-vars \
            --strict \
            --experimental-provision=false \
            --experimental-auto-create=false \
            --message "Phase 1 RLS live gate ${DISPATCH_SHA}" \
            >"$WRANGLER_UPLOAD_LOG_PATH" 2>&1; then
            echo "::error::Immutable Worker version upload failed. Raw output was suppressed."
            exit 1
          fi

          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const outputPath = process.env.WRANGLER_OUTPUT_FILE_PATH;
          async function verifyImmutableWorkerBoundary() {
            const originPath = process.env.IMMUTABLE_PREVIEW_ORIGIN_PATH;
            if (!outputPath || !originPath) throw new Error("Immutable preview output paths are not configured.");

            const parsed = [];
            for (const line of (await readFile(outputPath, "utf8")).split(/\r?\n/).filter(Boolean)) {
              try {
                parsed.push(JSON.parse(line));
              } catch {
                throw new Error("Wrangler structured output was invalid.");
              }
            }
            const upload = [...parsed].reverse().find((entry) => entry?.type === "version-upload");
            if (!upload || typeof upload.version_id !== "string") throw new Error("Wrangler did not report a Worker version upload.");
            if (typeof upload.preview_url !== "string") throw new Error("Wrangler did not report an immutable version preview URL.");

            const wrangler = JSON.parse(await readFile("wrangler.jsonc", "utf8"));
            const workerName = wrangler.name;
            const approvedBaseUrl = wrangler.vars?.APP_BASE_URL;
            if (typeof workerName !== "string" || typeof approvedBaseUrl !== "string") {
              throw new Error("Approved Worker preview boundary is incomplete.");
            }

            let previewUrl;
            let approvedBase;
            try {
              previewUrl = new URL(upload.preview_url);
              approvedBase = new URL(approvedBaseUrl);
            } catch {
              throw new Error("Worker preview boundary URL configuration is invalid.");
            }
            const approvedPrefix = `${workerName}.`;
            if (
              approvedBase.protocol !== "https:" ||
              !approvedBase.hostname.startsWith(approvedPrefix) ||
              !approvedBase.hostname.endsWith(".workers.dev")
            ) {
              throw new Error("Approved Worker base URL is outside the expected boundary.");
            }
            const accountSuffix = approvedBase.hostname.slice(workerName.length);
            if (
              previewUrl.protocol !== "https:" ||
              !previewUrl.hostname.endsWith(`-${workerName}${accountSuffix}`) ||
              previewUrl.username !== "" ||
              previewUrl.password !== "" ||
              previewUrl.port !== "" ||
              previewUrl.pathname !== "/" ||
              previewUrl.search !== "" ||
              previewUrl.hash !== ""
            ) {
              throw new Error("Wrangler reported an unexpected immutable version preview URL.");
            }
            await writeFile(originPath, `${previewUrl.origin}\n`, { encoding: "utf8", mode: 0o600 });
            console.log("Immutable Worker version preview is ready for protected RLS testing.");
            NODE

        - name: Verify immutable Worker staging boundary
          env:
            CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
            CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
            IMMUTABLE_PREVIEW_ORIGIN_PATH: ${{ runner.temp }}/immutable-preview-origin
          run: |
            node --input-type=module <<'NODE'
            import { readFile } from "node:fs/promises";
            import { fetchWithCloudflareAccess } from "./scripts/cloudflare-access-fetch.mjs";
            const originPath = process.env.IMMUTABLE_PREVIEW_ORIGIN_PATH;
            const origin = originPath ? (await readFile(originPath, "utf8")).trim() : "";
            const wrangler = JSON.parse(await readFile("wrangler.jsonc", "utf8"));
            const expectedUrl = wrangler.vars?.SUPABASE_URL;
            if (!origin || !expectedUrl) throw new Error("Approved staging boundary configuration is incomplete.");

            const unauthenticatedResponse = await fetch(`${origin}/health/config`, {
              headers: { accept: "application/json" },
              redirect: "manual"
            });
            const accessDeniedStatuses = new Set([301, 302, 303, 307, 308, 401, 403]);
            if (!accessDeniedStatuses.has(unauthenticatedResponse.status)) {
              throw new Error("Immutable preview did not return an expected Access denial.");
            }

            const expectedRef = new URL(expectedUrl).hostname.replace(/\.supabase\.co$/, "");
            const response = await fetchWithCloudflareAccess(
              `${origin}/health/config`,
              { headers: { accept: "application/json" } },
              { expectedOrigin: origin }
            );
            if (!response.ok) throw new Error(`Immutable preview config health check failed with HTTP ${response.status}.`);
            const payload = await response.json();
            const liveSupabase = payload?.config?.supabase;
            if (liveSupabase?.configured !== true || typeof liveSupabase?.projectRef !== "string" || liveSupabase.projectRef !== expectedRef) {
              throw new Error("Immutable Worker Supabase boundary does not match the approved staging configuration.");
            }
            console.log("Access-protected immutable Worker staging boundary verified.");
          }

          try {
            await verifyImmutableWorkerBoundary();
          } catch {
            console.error("Immutable preview boundary verification failed.");
            process.exitCode = 1;
          }
          NODE

      - name: Verify protected test credentials are present
        shell: bash
        env:
          MECCHA_RLS_USER_A_EMAIL: ${{ secrets.MECCHA_RLS_USER_A_EMAIL }}
          MECCHA_RLS_USER_A_PASSWORD: ${{ secrets.MECCHA_RLS_USER_A_PASSWORD }}
          MECCHA_RLS_USER_B_EMAIL: ${{ secrets.MECCHA_RLS_USER_B_EMAIL }}
          MECCHA_RLS_USER_B_PASSWORD: ${{ secrets.MECCHA_RLS_USER_B_PASSWORD }}
        run: |
          set +x
          missing=0
          for name in MECCHA_RLS_USER_A_EMAIL MECCHA_RLS_USER_A_PASSWORD MECCHA_RLS_USER_B_EMAIL MECCHA_RLS_USER_B_PASSWORD; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              echo "::error::Missing required staging Environment secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          if [ "$MECCHA_RLS_USER_A_EMAIL" = "$MECCHA_RLS_USER_B_EMAIL" ]; then
            echo "::error::RLS users A and B must be distinct accounts."
            exit 1
          fi

      - name: Run live RLS negative test against immutable Worker version
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          IMMUTABLE_PREVIEW_ORIGIN_PATH: ${{ runner.temp }}/immutable-preview-origin
          MECCHA_RLS_ALLOW_REMOTE_WRITE: I_UNDERSTAND_TEST_DATA_WILL_BE_CREATED
          MECCHA_RLS_USER_A_EMAIL: ${{ secrets.MECCHA_RLS_USER_A_EMAIL }}
          MECCHA_RLS_USER_A_PASSWORD: ${{ secrets.MECCHA_RLS_USER_A_PASSWORD }}
          MECCHA_RLS_USER_B_EMAIL: ${{ secrets.MECCHA_RLS_USER_B_EMAIL }}
          MECCHA_RLS_USER_B_PASSWORD: ${{ secrets.MECCHA_RLS_USER_B_PASSWORD }}
        run: |
          set +x
          export MECCHA_APP_ORIGIN="$(tr -d '\r\n' < "$IMMUTABLE_PREVIEW_ORIGIN_PATH")"
          npm run test:rls

      - name: Remove immutable preview target from the runner
        if: always()
        env:
          IMMUTABLE_PREVIEW_ORIGIN_PATH: ${{ runner.temp }}/immutable-preview-origin
        run: rm -f "$IMMUTABLE_PREVIEW_ORIGIN_PATH"

      - name: Record successful result summary
        env:
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          {
            echo "## Phase 1 RLS Live Gate"
            echo
            echo "- Result: success"
            echo "- Target: Access-protected immutable non-production Worker version preview"
            echo "- Tested commit: \`$DISPATCH_SHA\`"
            echo "- Test command: npm run test:rls"
            echo "- Unauthenticated config access was rejected before the protected request"
            echo "- Static config and immutable preview Supabase boundary were verified before RLS credentials were used"
            echo "- Credential values, external IDs, preview URL, and test data identifiers are not written to artifacts or summaries"
            echo "- The test may create staging workspace/test rows as documented by Issue #79"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record failed result summary
        if: failure()
        run: |
          {
            echo "## Phase 1 RLS Live Gate"
            echo
            echo "- Result: failed"
            echo "- This run did not complete the live RLS acceptance gate."
            echo "- Do not use this run as Issue #79 success evidence."
            echo "- Credential values, external IDs, preview URL, and test data identifiers are not written to artifacts or summaries."
          } >> "$GITHUB_STEP_SUMMARY"
