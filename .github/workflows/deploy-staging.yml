name: Staging Deployment Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Stagingで検証する40桁commit SHA
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-staging-candidate:
    name: Validate staging candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: staging-candidate-${{ inputs.candidate_sha }}
    environment: staging
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0

      - name: Verify immutable candidate SHA
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node scripts/deployment-candidate-evidence.mjs verify-candidate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run staging candidate checks
        run: npm run check

      - name: Write immutable staging evidence
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: node scripts/deployment-candidate-evidence.mjs write-staging-evidence

      - name: Upload staging evidence
        uses: actions/upload-artifact@v4
        with:
          name: staging-evidence-${{ inputs.candidate_sha }}
          path: staging-evidence/evidence.json
          retention-days: 30

      # R2、Supabase、Workerのstaging資源を作成し、別途ユーザー承認を得るまでdeploy stepは追加しない。
