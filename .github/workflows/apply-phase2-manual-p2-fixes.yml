name: Apply Phase 2 Manual P2 Fixes

on:
  push:
    branches:
      - feature/phase2-manual-list-create
    paths:
      - scripts/apply-phase2-manual-p2-fixes.mjs
      - .github/workflows/apply-phase2-manual-p2-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2-manual-list-create
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: node scripts/apply-phase2-manual-p2-fixes.mjs
      - run: npm ci
      - name: Test manual API and rollout boundaries
        run: node --experimental-transform-types --test tests/manual-api.test.mjs tests/manual-title-docs.test.mjs
      - name: Repository checks
        run: npm run check
      - name: Diff check
        run: git diff --check
      - name: Remove one-shot script and commit verified fixes
        run: |
          rm scripts/apply-phase2-manual-p2-fixes.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: cancel unread Supabase responses and lock rollout order"
          git push origin HEAD:feature/phase2-manual-list-create
