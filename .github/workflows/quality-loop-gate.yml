name: Quality Loop Gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-loop:
    name: Validate quality loop harness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate quality loop
        run: npm run quality-loop:check

      - name: Notify Discord
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MECCHA_DISCORD_WEBHOOK_URL: ${{ secrets.MECCHA_DISCORD_WEBHOOK_URL }}
          DISCORD_DEVELOPMENT_WEBHOOK_URL: ${{ secrets.DISCORD_DEVELOPMENT_WEBHOOK_URL }}
          DISCORD_NOTIFY_ENV: development
          DISCORD_NOTIFY_STATUS: ${{ job.status }}
          DISCORD_NOTIFY_TITLE: サブエージェント品質loop
          DISCORD_NOTIFY_DESCRIPTION: PRが品質loopの入口条件を満たすか確認しました。
          DISCORD_NOTIFY_IMPRESSION: ${{ job.status == 'success' && '品質loopの入口は通っています。実装、テスト、辛口レビュー、リファクタリングレビュー、ドキュメント記録の結論をPRで確認してからmerge判断へ進みます。' || '品質loopの入口で失敗しています。PRテンプレート、運用docs、ADR、報告テンプレートの欠落を確認します。' }}
        run: npm run notify:discord
