name: Apply Phase 2 Final Review Fixes

on:
  push:
    branches:
      - feature/phase2-manual-editor-ui
    paths:
      - ".github/workflows/apply-phase2-final-review-fixes.yml"
      - "scripts/apply-phase2-final-review-fixes.py"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2-manual-editor-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply latest Codex review fixes
        run: python scripts/apply-phase2-final-review-fixes.py
      - run: npm ci
      - name: Validate Phase 2 contracts
        run: |
          node scripts/check-phase2-manual-edit-api.mjs
          node scripts/check-phase2-manual-editor-ui.mjs
      - name: Test manual API and UI boundaries
        run: |
          node --experimental-transform-types --test tests/manual-api.test.mjs tests/manual-title-docs.test.mjs tests/manual-edit-api.test.mjs
          node --test tests/manual-editor-ui.test.mjs
      - name: Repository checks
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test Phase 1 browser regressions
        run: npx playwright test --config=playwright.phase1.config.mjs
      - name: Test Phase 2 browser flows
        run: npx playwright test --config=playwright.phase2.config.mjs
      - name: Diff check
        run: git diff --check
      - name: Commit permanent fixes only
        run: |
          rm scripts/apply-phase2-final-review-fixes.py
          rm .github/workflows/apply-phase2-final-review-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: enforce displayed manual step versions"
          git push origin HEAD:feature/phase2-manual-editor-ui
