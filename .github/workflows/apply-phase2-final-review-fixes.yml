name: Apply Phase 2 Final Review Fixes

on:
  push:
    branches:
      - feature/phase2-manual-editor-ui
    paths:
      - scripts/apply-phase2-final-review-fixes.py
      - .github/workflows/apply-phase2-final-review-fixes.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2-manual-editor-ui
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final review fixes
        run: |
          python scripts/apply-phase2-final-review-fixes.py
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/e2e/phase2-manual-editor.spec.mjs')
          text = path.read_text(encoding='utf-8')
          old = 'toEqual({ codePoints: 10000, codeUnits: 20000 });'
          new = 'toEqual({ codePoints: 10000, codeUnits: 19998 });'
          if old not in text:
              raise SystemExit('mixed Unicode code-unit expectation not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Refresh app asset version
        run: |
          VERSION=$(node --experimental-strip-types --input-type=module -e 'import { createHash } from "node:crypto"; import { APP_CSS, APP_JS } from "./apps/worker/src/app-assets.ts"; process.stdout.write("sha256-" + createHash("sha256").update(APP_CSS).update("\0").update(APP_JS).digest("hex").slice(0,16));')
          python - "$VERSION" <<'PY'
          from pathlib import Path
          import re, sys
          path = Path('apps/worker/src/app-assets.ts')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(r'export const APP_ASSET_VERSION = "sha256-[0-9a-f]{16}";', f'export const APP_ASSET_VERSION = "{sys.argv[1]}";', text, count=1)
          if count != 1:
              raise SystemExit('asset version declaration not found')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Validate Phase 2 contracts
        run: |
          node scripts/check-phase2-manual-edit-api.mjs
          node scripts/check-phase2-manual-editor-ui.mjs
      - name: Test manual API and UI boundaries
        run: |
          node --experimental-transform-types --test tests/manual-api.test.mjs tests/manual-title-docs.test.mjs tests/manual-edit-api.test.mjs
          node --test tests/manual-editor-ui.test.mjs
      - name: Install migrations in disposable Postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/phase2-manual-edit-http-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/202608140005_phase2_manual_title_length.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/202608140010_phase2_manual_step_mutations.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/202608140012_phase2_manual_edit_http_contract.sql
      - name: Exercise authenticated edit and bounds
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/phase2-manual-edit-http-test.sql
      - name: Exercise draft metadata concurrency
        run: bash scripts/test-phase2-manual-draft-locks.sh
      - name: Repository checks
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test Phase 1 browser regressions
        run: npx playwright test --config=playwright.phase1.config.mjs
      - name: Test Phase 2 browser flows
        run: npx playwright test --config=playwright.phase2.config.mjs
      - name: Diff check
        run: |
          git diff --check
          git diff --check origin/main...HEAD
      - name: Commit permanent fixes only
        run: |
          chmod +x scripts/test-phase2-manual-draft-locks.sh
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/worker/src/app-assets.ts \
            apps/worker/src/manual-edit-router.ts \
            supabase/migrations/202608140012_phase2_manual_edit_http_contract.sql \
            tests/manual-edit-api.test.mjs \
            tests/manual-editor-ui.test.mjs \
            tests/e2e/phase2-manual-editor.spec.mjs \
            tests/sql/phase2-manual-edit-http-fixture.sql \
            tests/sql/phase2-manual-edit-http-test.sql \
            scripts/test-phase2-manual-draft-locks.sh \
            scripts/check-phase2-manual-edit-api.mjs \
            scripts/check-phase2-manual-editor-ui.mjs \
            .github/workflows/manual-edit-api.yml \
            docs/05-api/phase2-manual-edit-api.md \
            docs/02-ux/phase2-manual-editor-ui.md \
            docs/09-delivery/decision-log.md
          git commit -m "fix: protect draft metadata and create flows"
          git push origin HEAD:feature/phase2-manual-editor-ui
