name: Apply Phase 2 Manual Editor UI

on:
  push:
    branches:
      - feature/phase2-manual-editor-ui
    paths:
      - ".github/workflows/apply-phase2-manual-editor-ui.yml"
      - "scripts/apply-phase2-manual-editor-ui.mjs"
      - "scripts/fix-phase2-manual-editor-e2e.mjs"
      - "scripts/update-phase2-manual-editor-docs.mjs"
      - "scripts/check-worker.mjs"
      - "tests/manual-editor-ui.test.mjs"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2-manual-editor-ui
          fetch-depth: 0
      - name: Merge latest manual edit API branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin feature/phase2-manual-edit-http-api
          git merge --no-ff origin/feature/phase2-manual-edit-http-api -m "merge: stack manual editor UI on edit API"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply UI and documentation integration
        run: |
          node scripts/apply-phase2-manual-editor-ui.mjs
          node scripts/fix-phase2-manual-editor-e2e.mjs
          node scripts/update-phase2-manual-editor-docs.mjs
      - run: npm ci
      - name: Validate manual editor UI contracts
        run: node scripts/check-phase2-manual-editor-ui.mjs
      - name: Test static manual editor safety boundaries
        run: node --test tests/manual-editor-ui.test.mjs
      - name: Repository checks
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test Phase 1 browser regressions
        run: npx playwright test --config=playwright.phase1.config.mjs
      - name: Test manual editor browser flows
        run: npx playwright test --config=playwright.phase2.config.mjs
      - name: Diff check
        run: git diff --check origin/feature/phase2-manual-edit-http-api...HEAD
      - name: Commit permanent UI only
        run: |
          rm scripts/apply-phase2-manual-editor-ui.mjs
          rm scripts/fix-phase2-manual-editor-e2e.mjs
          rm scripts/update-phase2-manual-editor-docs.mjs
          rm .github/workflows/apply-phase2-manual-editor-ui.yml
          git add -A
          git commit -m "feat: add manual list and editor UI"
          git push origin HEAD:feature/phase2-manual-editor-ui
