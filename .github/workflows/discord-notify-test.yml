name: Discord Notify Test

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Notification environment
        required: true
        default: development
        type: choice
        options:
          - development
          - staging
          - production

permissions:
  contents: read

jobs:
  notify:
    name: Send Discord test notification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Send required Discord notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MECCHA_DISCORD_WEBHOOK_URL: ${{ secrets.MECCHA_DISCORD_WEBHOOK_URL }}
          DISCORD_DEVELOPMENT_WEBHOOK_URL: ${{ secrets.DISCORD_DEVELOPMENT_WEBHOOK_URL }}
          DISCORD_STAGING_WEBHOOK_URL: ${{ secrets.DISCORD_STAGING_WEBHOOK_URL }}
          DISCORD_PRODUCTION_WEBHOOK_URL: ${{ secrets.DISCORD_PRODUCTION_WEBHOOK_URL }}
          DISCORD_NOTIFY_ENV: ${{ inputs.target_environment }}
          DISCORD_NOTIFY_REQUIRED: "true"
          DISCORD_NOTIFY_STATUS: success
          DISCORD_NOTIFY_TITLE: Discord notification smoke test
        run: npm run notify:discord
