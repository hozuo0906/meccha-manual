name: PR Latest Review Gate

on:
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 再確認するPull Request番号
        required: true
        type: number

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  latest-review:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && contains(github.event.comment.body, '/quality-gate'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout gate implementation
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 41 && github.actor == github.repository_owner && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || 'main' }}

      - name: Verify latest review and threads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
        run: node scripts/check-pr-quality-gate.mjs
