name: Apply Phase 2 Reconciliation Fixes

on:
  push:
    branches:
      - feature/phase2-manual-editor-ui
    paths:
      - scripts/apply-phase2-final-hardening.py
      - .github/workflows/apply-phase2-reconciliation-fixes.yml

permissions:
  contents: write

concurrency:
  group: apply-phase2-reconciliation-fixes
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2-manual-editor-ui
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply final hardening fixes
        run: python scripts/apply-phase2-final-hardening.py
      - name: Install dependencies
        run: npm ci
      - name: Validate static contracts
        run: |
          node scripts/check-phase2-manual-editor-ui.mjs
          node scripts/check-phase2-manual-edit-api.mjs
          node scripts/check-phase2-manual-step-migration.mjs
      - name: Test manual API and UI boundaries
        run: |
          node --experimental-transform-types --test tests/manual-api.test.mjs tests/manual-title-docs.test.mjs tests/manual-edit-api.test.mjs
          node --test tests/manual-editor-ui.test.mjs
      - name: Install migrations in disposable Postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/phase2-manual-edit-http-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/202608140005_phase2_manual_title_length.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/202608140010_phase2_manual_step_mutations.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/202608140012_phase2_manual_edit_http_contract.sql
      - name: Exercise authenticated edit and direct RPC boundaries
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/phase2-manual-edit-http-test.sql
      - name: Exercise draft metadata optimistic conflict
        run: bash scripts/test-phase2-manual-draft-locks.sh
      - name: Exercise publication and draft lock order
        run: bash scripts/test-phase2-manual-publication-locks.sh
      - name: Repository checks
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test Phase 1 browser regressions
        run: npx playwright test --config=playwright.phase1.config.mjs
      - name: Test Phase 2 browser flows
        run: npx playwright test --config=playwright.phase2.config.mjs
      - name: Diff check
        run: |
          git diff --check
          git diff --check origin/main...HEAD
      - name: Commit permanent fixes and remove temporary machinery
        run: |
          git rm \
            .github/workflows/apply-phase2-reconciliation-fixes.yml \
            scripts/apply-phase2-reconciliation-fixes.py \
            scripts/apply-phase2-final-hardening.py
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: close final manual editor review boundaries"
          git push origin HEAD:feature/phase2-manual-editor-ui
