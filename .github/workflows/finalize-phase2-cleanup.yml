name: Finalize Phase 2 Cleanup

on:
  push:
    branches:
      - feature/phase2-manual-editor-ui
    paths:
      - ".github/workflows/finalize-phase2-cleanup.yml"

permissions:
  contents: write

concurrency:
  group: finalize-phase2-cleanup
  cancel-in-progress: false

jobs:
  verify-and-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2-manual-editor-ui
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Ensure final P2 fixes are present
        run: |
          grep -F 'const isAction = type === "action";' apps/worker/src/app-assets.ts
          grep -F 'workspace editor role required' apps/worker/src/manual-router.ts
          grep -F 'currentUserRole: null' apps/worker/src/app-assets.ts
      - name: Install dependencies
        run: npm ci
      - name: Validate Phase 2 contracts
        run: |
          node scripts/check-phase2-manual-edit-api.mjs
          node scripts/check-phase2-manual-editor-ui.mjs
      - name: Test manual API and UI boundaries
        run: |
          node --experimental-transform-types --test tests/manual-api.test.mjs tests/manual-title-docs.test.mjs tests/manual-edit-api.test.mjs
          node --test tests/manual-editor-ui.test.mjs
      - name: Repository checks
        run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Test Phase 1 browser regressions
        run: npx playwright test --config=playwright.phase1.config.mjs
      - name: Test Phase 2 browser flows
        run: npx playwright test --config=playwright.phase2.config.mjs
      - name: Remove temporary fix automation
        run: |
          git rm -f \
            .github/workflows/apply-phase2-retained-version-fixes.yml \
            scripts/apply-phase2-retained-version-fixes.py \
            .github/workflows/apply-phase2-final-p2-fixes.yml \
            scripts/apply-phase2-final-p2-fixes.py \
            .github/workflows/finalize-phase2-cleanup.yml
      - name: Diff check
        run: git diff --check
      - name: Commit cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: remove temporary phase2 fix automation"
          git push origin HEAD:feature/phase2-manual-editor-ui
