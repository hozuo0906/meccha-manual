name: Browser Run Egress Proof

on:
  pull_request:
    paths:
      - ".github/workflows/browser-run-egress-proof.yml"
      - "scripts/browser-run-egress-proof.mjs"
      - "tests/browser-run-egress-proof.test.mjs"
      - "docs/08-operations/browser-run-egress-proof.md"
      - "docs/08-operations/browser-run-session-harness.md"
      - "docs/09-delivery/open-questions.md"
      - "docs/09-delivery/decision-log.md"
      - "package.json"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "隔離staging P0実証を開始する確認文字列"
        required: true
        type: string
      candidate_sha:
        description: "検証対象となるmainの40文字commit SHA"
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run browser-run:egress:test
      - run: npm run browser-run:egress:check
      - run: npm run check
      - name: Check PR diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${GITHUB_BASE_REF}...HEAD"

  live-proof-preflight:
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify immutable main candidate before requesting staging
        run: node scripts/browser-run-egress-proof.mjs --preflight
        env:
          BROWSER_EGRESS_RUN_CONFIRMATION: ${{ inputs.confirmation }}
          BROWSER_EGRESS_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MECCHA_MANUAL_BROWSER_EGRESS_STAGING_READY: ${{ vars.MECCHA_MANUAL_BROWSER_EGRESS_STAGING_READY }}

  live-proof:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.confirmation == 'RUN_ISOLATED_STAGING_P0' &&
      github.ref == 'refs/heads/main' &&
      github.sha == inputs.candidate_sha &&
      github.run_attempt == 1 &&
      vars.MECCHA_MANUAL_BROWSER_EGRESS_STAGING_READY == 'v1'
    needs:
      - contract
      - live-proof-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    concurrency:
      group: browser-run-egress-proof-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run isolated Browser Run egress proof
        run: npm run browser-run:egress:run
        env:
          BROWSER_EGRESS_RUN_CONFIRMATION: ${{ inputs.confirmation }}
          BROWSER_EGRESS_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          MECCHA_MANUAL_BROWSER_EGRESS_STAGING_READY: ${{ vars.MECCHA_MANUAL_BROWSER_EGRESS_STAGING_READY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.MECCHA_MANUAL_BROWSER_EGRESS_STAGING_ACCOUNT_ID }}
          CLOUDFLARE_BROWSER_RUN_API_TOKEN: ${{ secrets.MECCHA_MANUAL_BROWSER_EGRESS_STAGING_API_TOKEN }}
          BROWSER_EGRESS_FIXTURE_ORIGIN: ${{ vars.MECCHA_MANUAL_BROWSER_EGRESS_STAGING_FIXTURE_ORIGIN }}
          BROWSER_EGRESS_EVIDENCE_URL: ${{ vars.MECCHA_MANUAL_BROWSER_EGRESS_STAGING_EVIDENCE_URL }}
          BROWSER_EGRESS_FIXTURE_TOKEN: ${{ secrets.MECCHA_MANUAL_BROWSER_EGRESS_STAGING_FIXTURE_TOKEN }}
          BROWSER_EGRESS_ARTIFACT_PATH: browser-run-egress-evidence.json
      - name: Preserve sanitized run/SHA-bound evidence
        uses: actions/upload-artifact@v4
        with:
          name: browser-run-egress-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: browser-run-egress-evidence.json
          if-no-files-found: error
          retention-days: 90
