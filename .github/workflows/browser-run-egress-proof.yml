name: Browser Run Egress Proof

on:
  pull_request:
    paths:
      - ".github/workflows/browser-run-egress-proof.yml"
      - "scripts/browser-run-egress-proof.mjs"
      - "tests/browser-run-egress-proof.test.mjs"
      - "docs/08-operations/browser-run-egress-proof.md"
      - "docs/08-operations/browser-run-session-harness.md"
      - "docs/09-delivery/open-questions.md"
      - "docs/09-delivery/decision-log.md"
      - "package.json"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "隔離staging P0実証を開始する確認文字列"
        required: true
        type: string

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run browser-run:egress:test
      - run: npm run browser-run:egress:check
      - run: npm run check
      - name: Check PR diff whitespace
        if: github.event_name == 'pull_request'
        run: git diff --check "origin/${GITHUB_BASE_REF}...HEAD"

  live-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RUN_ISOLATED_STAGING_P0'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run isolated Browser Run egress proof
        run: npm run browser-run:egress:run
        env:
          BROWSER_EGRESS_RUN_CONFIRMATION: ${{ inputs.confirmation }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_BROWSER_RUN_API_TOKEN: ${{ secrets.CLOUDFLARE_BROWSER_RUN_API_TOKEN }}
          BROWSER_EGRESS_FIXTURE_ORIGIN: ${{ vars.BROWSER_EGRESS_FIXTURE_ORIGIN }}
          BROWSER_EGRESS_EVIDENCE_URL: ${{ vars.BROWSER_EGRESS_EVIDENCE_URL }}
          BROWSER_EGRESS_FIXTURE_TOKEN: ${{ secrets.BROWSER_EGRESS_FIXTURE_TOKEN }}
