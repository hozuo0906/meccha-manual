name: Codex Review Repair Loop

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

concurrency:
  group: codex-review-loop-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
      github.event.pull_request.head.repo.fork == false &&
      (github.event.review.user.login == 'chatgpt-codex-connector' || github.event.review.user.login == 'chatgpt-codex-connector[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
    outputs:
      run_repair: ${{ steps.inspect.outputs.run_repair }}
      head_sha: ${{ steps.inspect.outputs.head_sha }}
      head_ref: ${{ steps.inspect.outputs.head_ref }}
      pr_number: ${{ steps.inspect.outputs.pr_number }}
      review_id: ${{ steps.inspect.outputs.review_id }}
    steps:
      - name: Checkout trusted default-branch controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inspect trusted unresolved review threads
        id: inspect
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_PROMPT_PATH: ${{ runner.temp }}/codex-review-repair.md
          REPAIR_METADATA_PATH: ${{ runner.temp }}/codex-review-metadata.json
        run: node scripts/codex-review-loop.mjs inspect

      - name: Capture trusted PR changed-file scope
        if: steps.inspect.outputs.run_repair == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.inspect.outputs.pr_number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --jq '[.[].filename]' > "$RUNNER_TEMP/codex-review-scope.json"
          node -e 'const fs=require("fs");const paths=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!Array.isArray(paths)||paths.length>100||paths.some((path)=>typeof path!=="string"||!path)){throw new Error("Invalid trusted PR path scope")}' "$RUNNER_TEMP/codex-review-scope.json"

      - name: Store bounded repair request
        if: steps.inspect.outputs.run_repair == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-request-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/codex-review-repair.md
            ${{ runner.temp }}/codex-review-metadata.json
            ${{ runner.temp }}/codex-review-scope.json
          if-no-files-found: error
          retention-days: 1

  repair:
    needs: inspect
    if: needs.inspect.outputs.run_repair == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      candidate_tree: ${{ steps.candidate.outputs.candidate_tree }}
      candidate_paths_sha256: ${{ steps.candidate.outputs.candidate_paths_sha256 }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Codex CLI before PR checkout
        run: npm install -g @openai/codex

      - name: Checkout exact reviewed head without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore trusted repair request
        uses: actions/download-artifact@v4
        with:
          name: codex-review-request-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-review-request

      - name: Run credential-isolated Codex repair
        env:
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
          REPAIR_PROMPT_PATH: ${{ runner.temp }}/codex-review-request/codex-review-repair.md
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          unset GH_TOKEN GITHUB_TOKEN
          git config --local --unset-all http.https://github.com/.extraheader || true
          test -n "$CODEX_ACCESS_TOKEN"
          codex exec --sandbox workspace-write --config approval_policy=never --config model_reasoning_effort=high --model gpt-5.6-luna - < "$REPAIR_PROMPT_PATH"

      - name: Detect and authorize repair changes
        env:
          REVIEWED_SHA: ${{ needs.inspect.outputs.head_sha }}
          REPAIR_SCOPE_PATH: ${{ runner.temp }}/codex-review-request/codex-review-scope.json
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEWED_SHA" || {
            echo "Codex moved HEAD away from the exact reviewed SHA; refusing to export a partial or mismatched repair patch." >&2
            exit 1
          }
          git add -A
          if git diff --cached HEAD --quiet; then
            echo "Codex returned without a repair patch." >&2
            exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          import { execFileSync } from "node:child_process";

          const trustedScope = new Set(JSON.parse(readFileSync(process.env.REPAIR_SCOPE_PATH, "utf8")));
          const changedPaths = execFileSync("git", ["diff", "--cached", "--name-only", "-z", "HEAD"], { encoding: "utf8" }).split("\0").filter(Boolean);
          const originalTreePaths = new Set(execFileSync("git", ["ls-tree", "-r", "--name-only", "-z", "HEAD"], { encoding: "utf8" }).split("\0").filter(Boolean));
          const unauthorized = changedPaths.filter((path) => !trustedScope.has(path) && !(path.startsWith("tests/") && !originalTreePaths.has(path)));
          if (unauthorized.length) {
            console.error(`Repair changed paths outside the trusted PR scope: ${unauthorized.join(", ")}`);
            process.exit(1);
          }
          NODE

      - name: Export bounded candidate patch without executing PR code
        id: candidate
        run: |
          git diff --cached --binary --full-index HEAD > "$RUNNER_TEMP/codex-review-candidate.patch"
          test -s "$RUNNER_TEMP/codex-review-candidate.patch"
          test "$(wc -c < "$RUNNER_TEMP/codex-review-candidate.patch")" -le 10485760
          git diff --cached --name-only -z HEAD > "$RUNNER_TEMP/codex-review-candidate-paths"
          echo "candidate_tree=$(git write-tree)" >> "$GITHUB_OUTPUT"
          echo "candidate_paths_sha256=$(sha256sum "$RUNNER_TEMP/codex-review-candidate-paths" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Store candidate patch for fresh-runner testing
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-candidate-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-review-candidate.patch
          if-no-files-found: error
          retention-days: 1

  test_repair:
    needs: [inspect, repair]
    if: needs.repair.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      tested_tree: ${{ steps.tested.outputs.tested_tree }}
    steps:
      - name: Checkout exact reviewed head without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Restore candidate patch
        uses: actions/download-artifact@v4
        with:
          name: codex-review-candidate-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-review-candidate-patch

      - name: Apply candidate patch on fresh runner
        env:
          PATCH_PATH: ${{ runner.temp }}/codex-review-candidate-patch/codex-review-candidate.patch
        run: |
          test -s "$PATCH_PATH"
          test "$(wc -c < "$PATCH_PATH")" -le 10485760
          git apply --check --binary "$PATCH_PATH"
          git apply --binary "$PATCH_PATH"
          git add -A
          git diff --cached --name-only HEAD > "$RUNNER_TEMP/codex-review-changed-paths.txt"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies after secret-bearing job has ended
        env:
          REVIEWED_SHA: ${{ needs.inspect.outputs.head_sha }}
          CANDIDATE_TREE: ${{ needs.repair.outputs.candidate_tree }}
          CANDIDATE_PATHS_SHA256: ${{ needs.repair.outputs.candidate_paths_sha256 }}
        run: |
          validate_candidate() {
            test "$(/usr/bin/git rev-parse HEAD)" = "$REVIEWED_SHA"
            test "$(/usr/bin/git write-tree)" = "$CANDIDATE_TREE"
            /usr/bin/git diff --quiet
            test "$(/usr/bin/git diff --cached --name-only -z HEAD | /usr/bin/sha256sum | /usr/bin/cut -d' ' -f1)" = "$CANDIDATE_PATHS_SHA256"
          }
          npm ci
          validate_candidate

      - name: Validate automation contract on fresh runner
        env:
          REVIEWED_SHA: ${{ needs.inspect.outputs.head_sha }}
          CANDIDATE_TREE: ${{ needs.repair.outputs.candidate_tree }}
          CANDIDATE_PATHS_SHA256: ${{ needs.repair.outputs.candidate_paths_sha256 }}
        run: |
          validate_candidate() {
            test "$(/usr/bin/git rev-parse HEAD)" = "$REVIEWED_SHA"
            test "$(/usr/bin/git write-tree)" = "$CANDIDATE_TREE"
            /usr/bin/git diff --quiet
            test "$(/usr/bin/git diff --cached --name-only -z HEAD | /usr/bin/sha256sum | /usr/bin/cut -d' ' -f1)" = "$CANDIDATE_PATHS_SHA256"
          }
          npm run issue-codex:check
          validate_candidate

      - name: Run targeted checks
        env:
          REVIEWED_SHA: ${{ needs.inspect.outputs.head_sha }}
          CANDIDATE_TREE: ${{ needs.repair.outputs.candidate_tree }}
          CANDIDATE_PATHS_SHA256: ${{ needs.repair.outputs.candidate_paths_sha256 }}
        run: |
          validate_candidate() {
            test "$(/usr/bin/git rev-parse HEAD)" = "$REVIEWED_SHA"
            test "$(/usr/bin/git write-tree)" = "$CANDIDATE_TREE"
            /usr/bin/git diff --quiet
            test "$(/usr/bin/git diff --cached --name-only -z HEAD | /usr/bin/sha256sum | /usr/bin/cut -d' ' -f1)" = "$CANDIDATE_PATHS_SHA256"
          }
          if grep -Eq '^apps/extension/|^tests/extension-mvp\.test\.mjs$' "$RUNNER_TEMP/codex-review-changed-paths.txt"; then
            npm run extension:test
            validate_candidate
          fi
          if grep -Eq '^(apps/worker/src/infra/d1/|migrations/)|d1-' "$RUNNER_TEMP/codex-review-changed-paths.txt"; then
            npm run test:d1-workspace
            validate_candidate
            npm run test:d1-binding
            validate_candidate
          fi
          if grep -Eq 'access-identity|auth' "$RUNNER_TEMP/codex-review-changed-paths.txt"; then
            npm run test:access-identity
            validate_candidate
            npm run app:auth:test
            validate_candidate
          fi

      - name: Run repository checks
        env:
          REVIEWED_SHA: ${{ needs.inspect.outputs.head_sha }}
          CANDIDATE_TREE: ${{ needs.repair.outputs.candidate_tree }}
          CANDIDATE_PATHS_SHA256: ${{ needs.repair.outputs.candidate_paths_sha256 }}
        run: |
          validate_candidate() {
            test "$(/usr/bin/git rev-parse HEAD)" = "$REVIEWED_SHA"
            test "$(/usr/bin/git write-tree)" = "$CANDIDATE_TREE"
            /usr/bin/git diff --quiet
            test "$(/usr/bin/git diff --cached --name-only -z HEAD | /usr/bin/sha256sum | /usr/bin/cut -d' ' -f1)" = "$CANDIDATE_PATHS_SHA256"
          }
          git diff --cached --check HEAD
          npm run check
          validate_candidate

      - name: Export tested patch
        id: tested
        env:
          REVIEWED_SHA: ${{ needs.inspect.outputs.head_sha }}
          CANDIDATE_TREE: ${{ needs.repair.outputs.candidate_tree }}
          CANDIDATE_PATHS_SHA256: ${{ needs.repair.outputs.candidate_paths_sha256 }}
          BASH_ENV: ""
          ENV: ""
          PATH: /usr/bin:/bin
        run: |
          test "$(/usr/bin/git rev-parse HEAD)" = "$REVIEWED_SHA"
          test "$(/usr/bin/git write-tree)" = "$CANDIDATE_TREE"
          /usr/bin/git diff --quiet
          test "$(/usr/bin/git diff --cached --name-only -z HEAD | /usr/bin/sha256sum | /usr/bin/cut -d' ' -f1)" = "$CANDIDATE_PATHS_SHA256"
          /usr/bin/git diff --cached --binary --full-index HEAD > "$RUNNER_TEMP/codex-review-repair.patch"
          test -s "$RUNNER_TEMP/codex-review-repair.patch"
          test "$(wc -c < "$RUNNER_TEMP/codex-review-repair.patch")" -le 10485760
          tested_tree="$(/usr/bin/git write-tree)"
          test "$tested_tree" = "$CANDIDATE_TREE"
          echo "tested_tree=$tested_tree" >> "$GITHUB_OUTPUT"

      - name: Store tested patch
        uses: actions/upload-artifact@v4
        with:
          name: codex-review-tested-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-review-repair.patch
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [inspect, test_repair]
    if: needs.test_repair.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout exact reviewed head without credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout trusted default-branch controller
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted-controller
          fetch-depth: 1
          persist-credentials: false

      - name: Preserve trusted controller outside workspace
        run: |
          cp trusted-controller/scripts/codex-review-loop.mjs "$RUNNER_TEMP/codex-review-loop.mjs"
          rm -rf trusted-controller

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore tested patch
        uses: actions/download-artifact@v4
        with:
          name: codex-review-tested-patch-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-review-tested-patch

      - name: Restore trusted publication metadata
        uses: actions/download-artifact@v4
        with:
          name: codex-review-request-${{ github.run_id }}
          path: ${{ runner.temp }}/codex-review-request

      - name: Verify exact remote head before publication
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_METADATA_PATH: ${{ runner.temp }}/codex-review-request/codex-review-metadata.json
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_PR_NUMBER: ${{ needs.inspect.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.inspect.outputs.head_sha }}
          EXPECTED_HEAD_REF: ${{ needs.inspect.outputs.head_ref }}
          EXPECTED_REVIEW_ID: ${{ needs.inspect.outputs.review_id }}
          TESTED_TREE: ${{ needs.test_repair.outputs.tested_tree }}
        run: node "$RUNNER_TEMP/codex-review-loop.mjs" verify-head

      - name: Apply tested patch without executing it
        if: steps.verify.outputs.publication_state == 'unpublished'
        env:
          PATCH_PATH: ${{ runner.temp }}/codex-review-tested-patch/codex-review-repair.patch
        run: |
          test -s "$PATCH_PATH"
          test "$(wc -c < "$PATCH_PATH")" -le 10485760
          git apply --check --binary "$PATCH_PATH"
          git apply --binary "$PATCH_PATH"
          git diff --check HEAD

      - name: Commit tested repair
        if: steps.verify.outputs.publication_state == 'unpublished'
        id: commit
        env:
          PR_NUMBER: ${{ needs.inspect.outputs.pr_number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -c core.hooksPath=/dev/null add -A
          git -c core.hooksPath=/dev/null commit -m "fix: address Codex review findings for PR #${PR_NUMBER}"
          echo "new_head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fast-forward existing PR branch
        if: steps.verify.outputs.publication_state == 'unpublished'
        env:
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_PUBLISH_TOKEN }}
          HEAD_REF: ${{ needs.inspect.outputs.head_ref }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
        run: |
          test -n "$GH_TOKEN"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git -c core.hooksPath=/dev/null \
            -c remote.origin.url="https://github.com/${EXPECTED_REPOSITORY}.git" \
            -c credential.helper='!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f' \
            push origin "HEAD:refs/heads/${HEAD_REF}"

      - name: Select published head
        id: published
        env:
          PUBLICATION_STATE: ${{ steps.verify.outputs.publication_state }}
          EXISTING_SHA: ${{ steps.verify.outputs.new_head_sha }}
          COMMITTED_SHA: ${{ steps.commit.outputs.new_head_sha }}
        run: |
          if [ "$PUBLICATION_STATE" = "published" ]; then
            echo "new_head_sha=$EXISTING_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "new_head_sha=$COMMITTED_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve repaired threads and request exact-head review
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_METADATA_PATH: ${{ runner.temp }}/codex-review-request/codex-review-metadata.json
          NEW_HEAD_SHA: ${{ steps.published.outputs.new_head_sha }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_PR_NUMBER: ${{ needs.inspect.outputs.pr_number }}
          EXPECTED_HEAD_SHA: ${{ needs.inspect.outputs.head_sha }}
          EXPECTED_HEAD_REF: ${{ needs.inspect.outputs.head_ref }}
          EXPECTED_REVIEW_ID: ${{ needs.inspect.outputs.review_id }}
        run: node "$RUNNER_TEMP/codex-review-loop.mjs" complete
