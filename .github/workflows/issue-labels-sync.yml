name: Issue Labels Sync

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview changes without updating labels
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync issue labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate issue labels
        run: npm run issue-labels:check

      - name: Sync issue labels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_LABEL_SYNC_DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: node scripts/sync-issue-labels.mjs

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MECCHA_DISCORD_WEBHOOK_URL: ${{ secrets.MECCHA_DISCORD_WEBHOOK_URL }}
          DISCORD_DEVELOPMENT_WEBHOOK_URL: ${{ secrets.DISCORD_DEVELOPMENT_WEBHOOK_URL }}
          DISCORD_NOTIFY_ENV: development
          DISCORD_NOTIFY_REQUIRED: "false"
          DISCORD_NOTIFY_STATUS: ${{ job.status }}
          DISCORD_NOTIFY_TITLE: Issueラベル同期
          DISCORD_NOTIFY_DESCRIPTION: GitHub Issueの状態管理ラベルを定義ファイルから同期しました。
          DISCORD_NOTIFY_IMPRESSION: ${{ job.status == 'success' && 'Issueラベル同期は通っています。Discord由来Issueをtriage、実装中、レビュー待ち、blocked、doneで追える状態に近づきました。' || 'Issueラベル同期で失敗しています。label定義、GitHub Actions permissions、GITHUB_TOKENのIssues権限を確認します。' }}
        run: npm run notify:discord
