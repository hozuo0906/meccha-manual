name: Apply Phase 2 Manual Edit HTTP API

on:
  push:
    branches:
      - feature/phase2-manual-edit-http-api
    paths:
      - ".github/workflows/apply-phase2-manual-edit-http-api.yml"
      - "scripts/apply-phase2-manual-edit-http-api.mjs"
      - "scripts/fix-phase2-manual-edit-table-docs.mjs"

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase2-manual-edit-http-api
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply shared router and documentation integration
        run: |
          node scripts/apply-phase2-manual-edit-http-api.mjs
          node scripts/fix-phase2-manual-edit-table-docs.mjs
      - run: npm ci
      - name: Validate manual edit API contracts
        run: node scripts/check-phase2-manual-edit-api.mjs
      - name: Test manual API boundaries
        run: node --experimental-transform-types --test tests/manual-api.test.mjs tests/manual-title-docs.test.mjs tests/manual-edit-api.test.mjs
      - name: Install manual edit migrations in disposable Postgres
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/sql/phase2-manual-edit-http-fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/202608140005_phase2_manual_title_length.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/202608140010_phase2_manual_step_mutations.sql
          psql -X -v ON_ERROR_STOP=1 -f supabase/migrations/202608140012_phase2_manual_edit_http_contract.sql
      - name: Exercise authenticated edit and permission boundaries
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/phase2-manual-edit-http-test.sql
      - name: Validate migration safety and ordering
        run: |
          npm run migration:safety:check
          npm run migrations:check
      - name: Repository checks
        run: npm run check
      - name: Diff check
        run: git diff --check origin/feature/phase2-manual-draft-steps...HEAD
      - name: Commit permanent integration only
        run: |
          rm scripts/apply-phase2-manual-edit-http-api.mjs
          rm scripts/fix-phase2-manual-edit-table-docs.mjs
          rm .github/workflows/apply-phase2-manual-edit-http-api.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: connect manual detail and edit HTTP API"
          git push origin HEAD:feature/phase2-manual-edit-http-api
