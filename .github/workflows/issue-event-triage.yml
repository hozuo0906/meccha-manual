name: Issue Event Triage

on:
  issues:
    types:
      - opened
      - reopened
      - edited

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-event-triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    name: Triage issue event
    runs-on: ubuntu-latest
    if: ${{ !github.event.issue.pull_request }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate issue event triage
        run: node scripts/issue-event-triage.mjs --check

      - name: Triage issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/issue-event-triage.mjs

      - name: Notify Discord
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MECCHA_DISCORD_WEBHOOK_URL: ${{ secrets.MECCHA_DISCORD_WEBHOOK_URL }}
          DISCORD_DEVELOPMENT_WEBHOOK_URL: ${{ secrets.DISCORD_DEVELOPMENT_WEBHOOK_URL }}
          DISCORD_NOTIFY_ENV: development
          DISCORD_NOTIFY_REQUIRED: "false"
          DISCORD_NOTIFY_STATUS: ${{ job.status }}
          DISCORD_NOTIFY_TITLE: Issue自動受付 / #${{ github.event.issue.number }}
          DISCORD_NOTIFY_URL: ${{ github.event.issue.html_url }}
          DISCORD_NOTIFY_DESCRIPTION: ${{ github.event.issue.title }}
          DISCORD_NOTIFY_IMPRESSION: Issueを自動トリアージしました。実装は approved-for-codex ラベルが付くまで開始しません。
        run: npm run notify:discord
