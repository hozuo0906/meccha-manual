<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>手順書を編集 | めっちゃマニュアル</title><link rel="stylesheet" href="editor.css"></head>
<body><main>
  <header class="editor-header"><div class="brand-lockup"><img src="../assets/meccha-manual-logo-mark.png" width="56" height="56" alt="めっちゃマニュアル"><div><span class="eyebrow">めっちゃマニュアル</span><h1><label class="sr-only" for="title">手順書のタイトル</label><input id="title"></h1><label class="sr-only" for="description">手順書の説明</label><textarea id="description" placeholder="この手順書の説明"></textarea></div></div><div class="header-actions"><span id="saveState" class="save-state" role="status" aria-live="polite">編集中</span><button id="save" type="button">保存して続ける</button></div></header>
  <p class="local-note"><strong>この端末の下書き</strong>　編集内容はこの端末に保存されます。保存・共有を始めると、認証済みの登録画面へ必要なデータだけを送ります。機密情報は画像上をドラッグしてマスクしてください。</p>
  <div class="layout"><nav aria-label="手順一覧"><div class="section-heading"><div><h2>手順</h2></div><button id="addStep" type="button">手順を追加</button></div><ol id="steps"></ol></nav><section><div class="section-heading"><div><h2>現在の手順内容</h2></div><p class="section-hint">画像を見ながら、伝わる説明に整えます。</p></div><div id="detail"></div></section></div>
  <p id="status" role="status" aria-live="polite"></p>
  <dialog id="outputGate" aria-labelledby="outputGateTitle">
    <form method="dialog" class="output-gate">
      <div class="gate-brand"><img src="../assets/meccha-manual-mascot-me-clear-eyes.png" width="104" height="104" alt="手順書の準備をするめっちゃマニュアルのキャラクター"><div><span class="eyebrow">保存・共有</span><h2 id="outputGateTitle">この手順書を保存・共有する</h2></div></div>
      <p>登録画面へ進む前に、この端末に保存された手順書を確認してください。</p>
      <p class="local-note">手順書本文と画像はこの端末に残ります。登録画面へ本文や認証情報を送信しません。共有は次の画面で明示的に設定します。</p>
      <div class="gate-actions">
        <button id="cancelOutput" value="cancel" type="submit" class="secondary">編集に戻る</button>
        <button id="startRegistration" value="continue" type="button">登録画面へ進む</button><button id="startShare" value="continue" type="button" class="secondary">共有設定へ進む</button>
      </div>
      <div id="handoffProgress" class="handoff-progress" hidden><img src="../assets/meccha-manual-mascot-me-clear-eyes.png" width="72" height="72" alt="保存先を準備中"><p id="handoffProgressText">保存先を準備しています。</p></div>
      <p id="gateStatus" role="status" aria-live="polite"></p>
    </form>
  </dialog>
</main><script type="module" src="editor.js"></script></body></html>
