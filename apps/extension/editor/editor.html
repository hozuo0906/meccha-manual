<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>手順書を編集</title><link rel="stylesheet" href="editor.css"></head>
<body><main>
  <header><div><span>編集中</span><h1><label class="sr-only" for="title">手順書のタイトル</label><input id="title"></h1><label class="sr-only" for="description">手順書の説明</label><textarea id="description" placeholder="この手順書の説明"></textarea></div><button id="save" type="button">保存して続ける</button></header>
  <p class="local-note">この下書きはこのブラウザ・端末だけに保存されます。拡張機能やブラウザデータを削除すると復元できない場合があります。</p>
  <div class="layout"><nav aria-label="手順一覧"><h2>手順</h2><button id="addStep" type="button">手順を追加</button><ol id="steps"></ol></nav><section><h2>現在の手順内容</h2><div id="detail"></div></section></div>
  <p id="status" role="status" aria-live="polite"></p>
  <dialog id="outputGate" aria-labelledby="outputGateTitle">
    <form method="dialog" class="output-gate">
      <h2 id="outputGateTitle">この手順書を登録する</h2>
      <p>登録画面へ進む前に、この端末に保存された手順書を確認してください。</p>
      <p class="local-note">手順書本文と画像はこの端末に残ります。登録画面へ本文や認証情報を送信しません。</p>
      <div class="gate-actions">
        <button id="cancelOutput" value="cancel" type="submit" class="secondary">編集に戻る</button>
        <button id="startRegistration" value="continue" type="button">登録画面へ進む</button>
      </div>
      <p id="gateStatus" role="status" aria-live="polite"></p>
    </form>
  </dialog>
</main><script type="module" src="editor.js"></script></body></html>
