<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>操作を記録</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <main class="shell">
    <header class="brand-header">
      <img class="brand-mark" src="../assets/meccha-manual-logo-mark.png" alt="めっちゃマニュアル">
      <div>
        <p class="eyebrow">操作を記録</p>
        <h1>手順書を作る</h1>
      </div>
    </header>

    <section class="intro" aria-labelledby="introTitle">
      <div>
        <p class="eyebrow" id="introTitle">今のタブだけ</p>
        <p class="intro-copy">いつもの操作を、見返せる手順にします。</p>
      </div>
      <span id="modeBadge" class="mode-badge">PC</span>
    </section>

    <section id="startSection" class="start-section" aria-labelledby="startTitle">
      <h2 id="startTitle">記録する画面</h2>
      <label for="mode">表示モード</label>
      <select id="mode">
        <option value="pc">PC</option>
        <option value="smartphonePortrait">スマホ（縦）</option>
        <option value="smartphoneLandscape">スマホ（横）</option>
        <option value="tabletPortrait">タブレット（縦）</option>
        <option value="tabletLandscape">タブレット（横）</option>
      </select>
      <button id="start" class="primary" type="button">操作を記録する</button>
      <p class="privacy-note">入力欄の値は操作データとして保存しません。画像では入力欄などを自動で隠します。画面に表示された個人情報は保存前に確認してください。</p>
    </section>

    <section id="liveSection" class="live-section" hidden aria-labelledby="liveTitle">
      <div class="section-heading">
        <div>
          <p class="eyebrow">記録中の手順</p>
          <h2 id="liveTitle">記録中の手順</h2>
        </div>
        <span id="liveCount" class="count-badge">0</span>
      </div>
      <p id="liveDescription" class="live-description">操作すると、ここに手順が追加されます。</p>
      <ol id="liveSteps" class="step-list"></ol>
    </section>

    <section id="draftSection" class="draft-section" hidden aria-labelledby="draftTitle">
      <div class="section-heading">
        <div>
          <p class="eyebrow">この端末に保存した手順書</p>
          <h2 id="draftTitle">最近の手順書</h2>
        </div>
        <span id="draftCount" class="count-badge">0</span>
      </div>
      <div id="drafts" class="draft-list"></div>
    </section>

    <section id="emptyState" class="empty-state" aria-live="polite">
      <img src="../assets/meccha-manual-mascot-me-clear-eyes.png" alt="めっちゃマニュアルのキャラクター">
      <h2>準備できています</h2>
      <p>「操作を記録する」を押して、いつもの操作をはじめましょう。</p>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
  </main>

  <footer class="controls" aria-label="記録の操作">
    <button id="pause" class="quiet" type="button" hidden>一時停止</button>
    <button id="finish" class="success" type="button" hidden>記録を終了</button>
    <button id="resume" class="success" type="button" hidden>このタブで再開</button>
    <button id="cancel" class="quiet" type="button" hidden>キャンセル</button>
    <button id="restore" class="quiet" type="button" hidden>画面をもう一度復元</button>
  </footer>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
