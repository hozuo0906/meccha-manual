<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>操作を記録</title><link rel="stylesheet" href="popup.css"></head>
<body><main><h1>操作を記録</h1><p class="note">スマホ・タブレットはPC版Chromeの画面幅を近づけるレスポンシブ表示です。実機を完全再現するものではありません。</p>
<label for="mode">表示モード</label><select id="mode"><option value="pc">PC</option><option value="smartphonePortrait">スマホ（縦）</option><option value="smartphoneLandscape">スマホ（横）</option><option value="tabletPortrait">タブレット（縦）</option><option value="tabletLandscape">タブレット（横）</option></select>
<button id="start">記録開始</button><button id="finish" class="secondary" hidden>記録を終了して編集</button><button id="cancel" class="link" hidden>キャンセル</button><p id="status" role="status" aria-live="polite"></p></main><script type="module" src="popup.js"></script></body></html>
