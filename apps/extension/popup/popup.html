<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>操作を記録</title><link rel="stylesheet" href="popup.css"></head>
<body><main><h1>操作を記録</h1><p class="note">スマホ・タブレットはPC版Chromeの画面幅を近づける表示です。実機の表示を保証するものではありません。</p><p class="note">入力欄の値は操作データとして保存しません。画像では入力欄などを自動で隠します。画面に表示された個人情報は保存前に確認してください。</p>
<label for="mode">表示モード</label><select id="mode"><option value="pc">PC</option><option value="smartphonePortrait">スマホ（縦）</option><option value="smartphoneLandscape">スマホ（横）</option><option value="tabletPortrait">タブレット（縦）</option><option value="tabletLandscape">タブレット（横）</option></select>
<button id="start">操作を記録する</button><button id="finish" class="secondary" hidden>記録を終了して編集</button><button id="resume" class="secondary" hidden>このタブで記録を再開</button><button id="cancel" class="link" hidden>キャンセル</button><button id="restore" class="link" hidden>もう一度復元</button>
<section id="draftSection" hidden><label for="recentDraft">最近の下書き</label><select id="recentDraft"></select><button id="openDraft" class="link">選択した下書きを開く</button></section>
<p id="status" role="status" aria-live="polite"></p></main><script type="module" src="popup.js"></script></body></html>
